# Build the demo for GitHub Pages under https://<user>.github.io/optika/ and deploy it.
# Root deployments (Vercel / Netlify) keep using vercel.json and public/_redirects with the default base "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (base /optika/)
        run: npm run build
        env:
          BASE_PATH: /optika/

      # SPA fallback: GitHub Pages serves 404.html for deep links such as /optika/admin/narudzbe,
      # so it must be the app shell. Known routes also get their own <route>/index.html copy so shared
      # links answer 200 instead of 404. .nojekyll keeps files that start with "_" in the artifact.
      - name: SPA fallback
        run: |
          node scripts/spa-shells.mjs dist
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
