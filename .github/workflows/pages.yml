# Build the site for GitHub Pages and deploy it: under https://<user>.github.io/optika/, or at the root of the shop's
# own domain once the CUSTOM_DOMAIN variable is set.
# Root deployments (Vercel / Netlify) keep using vercel.json and public/_redirects with the default base "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Optional repository variables (Settings → Secrets and variables → Actions → Variables):
    #   WEB3FORMS_KEY  the shop's Web3Forms access key — orders, bookings and requests are e-mailed to the shop
    #                  (public by design: it can only send to the address it was created for)
    #   CUSTOM_DOMAIN  e.g. optikamiftari.com, once its DNS points at GitHub Pages — the site is then built for the
    #                  domain root (base "/") with canonical URLs, sitemap and a CNAME file for that domain
    env:
      VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || '/optika/' }}
      SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://ariongj.github.io' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Per-route HTML shells (own title, description, preview image, canonical, JSON-LD) so shared links and
      # crawlers get HTTP 200 + the right preview; 404.html stays the SPA fallback for anything else (e.g.
      # /optika/admin/narudzbe). Also writes sitemap.xml and robots.txt. .nojekyll keeps files that start with "_".
      - name: Route shells, SEO and SPA fallback
        run: |
          node scripts/prerender-meta.mjs
          touch dist/.nojekyll
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
